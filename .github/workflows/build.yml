name: Unzip and Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir extracted
          Z=$(ls *.zip | sort | tail -1)
          echo "Using: $Z"
          unzip -q "$Z" -d extracted
          D=$(dirname "$(find extracted -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$D" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" RedFolderPK.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RedFolderPK-apk
          path: RedFolderPK.apk
